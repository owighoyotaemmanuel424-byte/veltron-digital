name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veltron?schema=public
      AUTH_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters-long
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm to current supported major
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build without touching production data
        run: npm run build
